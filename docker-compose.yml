version: '3.8'

services:
  bot:
    build: .
    container_name: music-suggest-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - AUDD_API_TOKEN=${AUDD_API_TOKEN}
      - TELEGRAM_PROXY=${TELEGRAM_PROXY:-}
      - ENABLE_PREFETCH=true
      - PREFETCH_MODE=artist
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
